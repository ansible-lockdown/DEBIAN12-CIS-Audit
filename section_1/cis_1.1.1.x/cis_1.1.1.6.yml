---

{{ if .Vars.deb12cis_level_2 }}
  {{ if .Vars.deb12cis_rule_1_1_1_6 }}
command:
  overlayfs:
    title: 1.1.1.6 | Ensure overlayfs kernel module is not available | disabled
    exit-status: 0
    exec: "modprobe -n -v overlayfs | grep -E '(overlayfs|install)'"
    stdout:
    - install /bin/true
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.6
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  blacklist_overlayfs:
    title: 1.1.1.6 | Ensure overlayfs kernel module is not available | blacklist
    exit-status: 0
    exec: grep overlayfs /etc/modprobe.d/*.conf
    stdout:
      - '/blacklist overlayfs/'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.6
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  {{ end }}
{{ end }}
