---

{{ if .Vars.deb12cis_desktop_required }}
  {{ if .Vars.deb12cis_level_1 }}
    {{ if .Vars.deb12cis_rule_1_7_3 }}
command:
  gdm_last_login:
    title: 1.7.3 | Ensure GDM disable-user-list option is enabled | gdm profile
    exec: cat /etc/dconf/profile/gdm
    exit-status: 0
    stdout:
    - '/^user-db:user$/'
    - '/^system-db:{{ .Vars.deb12cis_dconf_db_name }}$/'
    - '/^file-db:\/usr\/share\/gdm\/greeter-dconf-defaults$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.3
  gdm_disable_user:
    title: 1.7.3 | Ensure GDM disable-user-list option is enabled | disable-user-list setting
    exec: cat /etc/dconf/db/{{ .Vars.deb12cis_dconf_db_name }}.d/* 2>/dev/null | grep -E '^\s*disable-user-list\s*='
    exit-status: 0
    stdout:
    - '/^disable-user-list=true$/'
    - '!/^\s*disable-user-list\s*=\s*false/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.3
    {{ end }}
  {{ end }}
{{ end }}
