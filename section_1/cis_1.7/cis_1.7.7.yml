---

{{ if .Vars.deb12cis_desktop_required }}
  {{ if .Vars.deb12cis_level_1 }}
    {{ if .Vars.deb12cis_rule_1_7_7 }}
command:
  gdm_automount_locks:
    title: 1.7.7 | Ensure GDM disabling automatic mounting of removable media is not overridden
    exec: cat /etc/dconf/db/{{ .Vars.deb12cis_dconf_db_name }}.d/locks/* 2>/dev/null
    exit-status: 0
    stdout:
    - '/^\/org\/gnome\/desktop\/media\-handling\/automount$/'
    - '/^\/org\/gnome\/desktop\/media\-handling\/automount\-open$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.7
    {{ end }}
  {{ end }}
{{ end }}
