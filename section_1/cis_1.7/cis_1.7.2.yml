---

{{ if .Vars.deb12cis_desktop_required }}
  {{ if .Vars.deb12cis_level_1 }}
    {{ if .Vars.deb12cis_rule_1_7_2 }}
file:
  /etc/dconf/profile/gdm:
    title: 1.7.2 | Ensure GDM login banner is configured | gdm profile
    exists: true
    contents:
    - '/^user-db:user$/'
    - '/^system-db:{{ .Vars.deb12cis_dconf_db_name }}$/'
    - '/^file-db:\/usr\/share\/gdm\/greeter-dconf-defaults$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.2
command:
  gdm_banner_msg:
    title: 1.7.2 | Ensure GDM login banner is configured | banner settings
    exec: cat /etc/dconf/db/{{ .Vars.deb12cis_dconf_db_name }}.d/* 2>/dev/null | grep -E '^\s*banner-message-(enable|text)\s*='
    exit-status: 0
    stdout:
    - '/^banner-message-enable=true$/'
    - '!/^\s*banner-message-enable\s*=\s*false/'
    - "banner-message-text='{{ .Vars.deb12cis_warning_banner }}'"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.2
    {{ end }}
  {{ end }}
{{ end }}
