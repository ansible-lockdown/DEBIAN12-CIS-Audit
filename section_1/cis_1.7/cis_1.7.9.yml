---

{{ if .Vars.deb12cis_desktop_required }}
  {{ if .Vars.deb12cis_level_1 }}
    {{ if .Vars.deb12cis_rule_1_7_9 }}
command:
  gdm_autorun_locks:
    title: 1.7.9 | Ensure GDM autorun-never is not overridden
    exec: cat /etc/dconf/db/{{ .Vars.deb12cis_dconf_db_name }}.d/locks/* 2>/dev/null
    exit-status: 0
    stdout:
    - '/^\/org\/gnome\/desktop\/media\-handling\/autorun\-never$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.9
    {{ end }}
  {{ end }}
{{ end }}
