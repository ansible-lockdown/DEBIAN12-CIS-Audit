---

{{ if .Vars.deb12cis_desktop_required }}
  {{ if .Vars.deb12cis_level_1 }}
    {{ if .Vars.deb12cis_rule_1_7_5 }}
command:
  gdm_screensaver_locks:
    title: 1.7.5 | Ensure GDM screen locks cannot be overridden
    exec: cat /etc/dconf/db/{{ .Vars.deb12cis_dconf_db_name }}.d/locks/* 2>/dev/null
    exit-status: 0
    stdout:
    - '/^\/org\/gnome\/desktop\/session\/idle\-delay$/'
    - '/^\/org\/gnome\/desktop\/screensaver\/lock\-delay$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.5
    {{ end }}
  {{ end }}
{{ end }}
