---

{{ if .Vars.deb12cis_desktop_required }}
  {{ if .Vars.deb12cis_level_1 }}
    {{ if .Vars.deb12cis_rule_1_7_4 }}
file:
  /etc/dconf/profile/user:
    title: 1.7.4 | Ensure GDM screen locks when the user is idle | user profile
    exists: true
    contents:
    - '/^user-db:user$/'
    - '/^system-db:{{ .Vars.deb12cis_dconf_db_name }}$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.4
  00-screensaver:
    title: 1.7.4 | Ensure GDM screen locks when the user is idle | settings
    path: /etc/dconf/db/{{ .Vars.deb12cis_dconf_db_name }}.d/00-screensaver
    exists: true
    contents:
    - '/^\[org\/gnome\/desktop\/session\]$/'
    - '/^idle-delay=uint32 ([1-9]|[1-9][0-9]|[1-8][0-9][0-9]|900)$/'
    - '/^\[org\/gnome\/desktop\/screensaver\]$/'
    - '/^lock-delay=uint32 [0-5]$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.4
    {{ end }}
  {{ end }}
{{ end }}
