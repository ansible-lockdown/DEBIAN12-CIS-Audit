---

{{ if .Vars.deb12cis_level_1 }}
  {{ if .Vars.deb12cis_rule_4_4_2_1 }}
command:
  ipt_def_deny:
    title: 4.4.2.1 | Ensure iptables default deny firewall policy
    exec: iptables -L
    exit-status: 0
    stdout:
    - '/^Chain INPUT \(policy (DROP|REJECT)\)/'
    - '/^Chain FORWARD \(policy (DROP|REJECT)\)/'
    - '/^Chain OUTPUT \(policy (DROP|REJECT)\)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.4.2.1
      NIST800-53R5:
      - CA-9
      - SC-7
  {{ end }}
{{ end }}
