---

{{ if .Vars.deb12cis_level_1 }}
  {{ if .Vars.deb12cis_rule_6_3_2 }}
    {{ if eq .Vars.deb12cis_aide_scan "cron" }}
command:
  aide_cron:
    title: 6.3.2 | Ensure filesystem integrity is regularly checked | cron
    exec: |
      grep -Prs '^([^#\n\r]+\h+)?(\/usr\/s?bin\/|^\h*)aide(\.wrapper)?\h+([^#\n\r]+\h+)?(--(check|update)|\$AIDEARGS)\b' /etc/cron.* /etc/crontab /var/spool/cron/
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/aide/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.3.2
      NIST800-53R5:
      - AU-2
    {{ end }}
    {{ if eq .Vars.deb12cis_aide_scan "timer" }}
service:
  dailyaidecheck.timer:
    title: 6.3.2 | Ensure filesystem integrity is regularly checked | timer
    enabled: true
    running: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.3.2
      NIST800-53R5:
      - AU-2
command:
  dailyaidecheck_service:
    title: 6.3.2 | Ensure filesystem integrity is regularly checked | service
    exec: systemctl is-enabled dailyaidecheck.service
    exit-status: 0
    stdout:
    - '/^(static|enabled)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.3.2
      NIST800-53R5:
      - AU-2
    {{ end }}
  {{ end }}
{{ end }}
