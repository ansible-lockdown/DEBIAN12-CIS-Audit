---

{{ if .Vars.deb12cis_level_1 }}
  {{ if .Vars.deb12cis_rule_6_1_1_4 }}
service:
  onesyslog:
    title: 6.1.1.4 | Ensure only one logging system is in use
    {{ if eq .Vars.deb12cis_syslog "journald"}}
    name: rsyslog
    {{ end }}
    {{ if eq .Vars.deb12cis_syslog "rsyslog"}}
    name: journald
    {{ end }}
    running: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.4
      CISv8:
      - 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
  {{ end }}
{{ end }}
