---

{{ if .Vars.deb12cis_level_2 }}
  {{ if .Vars.deb12cis_rule_6_2_3_6 }}
command:
  auditd_priv_cmds_cnf:
    title: 6.2.3.6 | Ensure use of privileged commands are collected | conf check
    exec: grep privileged /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/-a always,exit -F path=\S+ -F perm=x -F auid>=\d+ -F auid!=unset -k privileged$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.6
      NIST800-53R5:
      - AU-3
  auditd_priv_cmds_live:
    title: 6.2.3.6 | Ensure use of privileged commands are collected | running
    exec: auditctl -l | grep privileged
    exit-status: 0
    stdout:
    - '/^-a always,exit -F path=\S+ -F perm=x -F auid>=\d+ -F auid!=-1 -F key=privileged$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.6
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
