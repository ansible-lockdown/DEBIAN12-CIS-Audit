---

{{ if .Vars.deb12cis_level_1 }}
  {{ if .Vars.deb12cis_rule_7_1_5 }}
file:
  etc_shadow_perms:
    title: 7.1.5 | Ensure permissions on /etc/shadow are configured
    path: /etc/shadow
    exists: true
    mode: u=rw,g=r,o=
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.5
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
