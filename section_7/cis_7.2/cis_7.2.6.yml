---
{{ if .Vars.deb12cis_level_1 }}
  {{ if .Vars.deb12cis_rule_7_2_6 }}
command:
  no_dup_gid:
    title: 7.2.6 | Ensure no duplicate GIDs exist
    exec: "cat /etc/group | cut -d: -f3 | uniq -d"
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.6
  {{ end }}
{{ end }}
