---

{{ if .Vars.deb12cis_level_1 }}
  {{ if .Vars.deb12cis_rule_5_1_6 }}
file:
  sshd_ciphers:
    title: 5.1.6 | Ensure sshd Ciphers are configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^Ciphers {{ .Vars.deb12cis_sshd_ciphers }}/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.6
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
