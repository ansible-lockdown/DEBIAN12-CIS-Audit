---

{{ if .Vars.deb12cis_level_1 }}
  {{ if .Vars.deb12cis_rule_5_1_15 }}
file:
  sshd_MACS:
    title: 5.1.15 | Ensure sshd MACs are configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^MACs {{ .Vars.deb12cis_sshd_macs }}/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.15
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
