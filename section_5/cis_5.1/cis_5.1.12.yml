---

{{ if .Vars.deb12cis_level_1 }}
  {{ if .Vars.deb12cis_rule_5_1_12 }}
file:
  sshd_KEX:
    title: 5.1.12 | Ensure sshd KexAlgorithms is configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^KexAlgorithms {{ .Vars.deb12cis_sshd_kex_algorithms }}/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.12
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
