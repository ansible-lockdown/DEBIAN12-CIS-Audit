---

{{ if .Vars.deb12cis_level_1 }}
  {{ if .Vars.deb12cis_rule_5_4_1_1 }}
command:
  login_defs_max_days:
    title: 5.4.1.1 | Ensure password expiration is configured
    exec: grep PASS_MAX_DAYS /etc/login.defs
    exit-status: 0
    stdout:
    - '/^PASS_MAX_DAYS\s+{{ .Vars.deb12cis_pass_max_days }}/'
    - '!/^PASS_MAX_DAYS\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])/'
    - '!/^PASS_MAX_DAYS\s+-1/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.1
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  check_user_expiry:
    title: 5.4.1.1 | Ensure password expiration is configured | check_users
    skip: {{ not .Vars.deb12cis_force_user_maxdays }}
    exec: |
      awk -F: '($2~/^\$.+\$/) {if($5 > 365 || $5 < 1) print "FAIL: " $1 " PASS_MAX_DAYS: " $5}' /etc/shadow
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.1
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
