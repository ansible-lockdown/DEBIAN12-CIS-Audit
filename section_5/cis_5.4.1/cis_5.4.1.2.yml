---

{{ if .Vars.deb12cis_level_1 }}
  {{ if .Vars.deb12cis_rule_5_4_1_2 }}
file:
  login_defs_min_days:
    title: 5.4.1.2 | Ensure minimum password days is configured
    path: /etc/login.defs
    exists: true
    contents:
    - '/^PASS_MIN_DAYS\s[1-9]/'
    - '!/^PASS_MIN_DAYS\s0/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.2
      NIST800-53R5: NA
command:
  check_users_MIN_DAYS:
    title: 5.4.1.2 | Ensure minimum password days is configured | check users
    skip: {{ not .Vars.deb12cis_force_user_mindays }}
    exec: |
      awk -F: '($2~/^\$.+\$/) {if($4 < 1) print "FAIL: " $1 " PASS_MIN_DAYS: " $4}' /etc/shadow
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.2
      NIST800-53R5: NA
  {{ end }}
{{ end }}
