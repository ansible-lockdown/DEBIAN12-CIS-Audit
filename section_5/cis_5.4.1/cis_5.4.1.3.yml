---

{{ if .Vars.deb12cis_level_1 }}
  {{ if .Vars.deb12cis_rule_5_4_1_3 }}
file:
  login_defs_warn_age:
    title: 5.4.1.3 | Ensure password expiration warning days is configured
    path: /etc/login.defs
    exists: true
    contents:
    - '/^PASS_WARN_AGE\s+{{ .Vars.deb12cis_pass_warn_age }}$/'
    - '/^PASS_WARN_AGE\s+(7|[1-9][0-9]{1,3})$/'
    - '!/^PASS_WARN_AGE\s+[1-6]$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.3
      NIST800-53R5: NA
command:
  check_users_MAX_DAYS:
    title: 5.4.1.3 | Ensure password expiration warning days is configured | check_users
    skip: {{ not .Vars.deb12cis_force_user_warnage }}
    exec: |
      awk -F: '($2~/^\$.+\$/) {if($6 < 7) print "FAIL: " $1 " PASS_WARN_AGE: " $6}' /etc/shadow
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
